name: Release Latest

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.task/**'
      - 'Taskfile.yml'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
      - name: 切出代码 / Checkout Code
        uses: actions/checkout@v4

      - name: 构建应用 / Build Application
        run: |
          cd FileOpener
          xcodebuild -project FileOpener.xcodeproj \
            -scheme FileOpener \
            -configuration Release \
            -destination "platform=macOS" \
            OBJROOT="$(pwd)/build/obj" \
            SYMROOT="$(pwd)/build/sym" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 DMG / Create DMG
        run: |
          APP_PATH="FileOpener/build/sym/Release/FileOpener.app"
          DMG_NAME="FileOpener.dmg"
          
          # 安装 create-dmg，用于创建带有漂亮拖拽界面的 DMG
          brew install create-dmg
          
          # 创建一个只存放应用本身的中转目录
          mkdir -p dmg_staging
          cp -R "$APP_PATH" dmg_staging/
          
          # 使用 create-dmg 创建，它可以自动设置内部的 Application 快捷方式和图标位置
          create-dmg \
            --volname "FileOpener Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "FileOpener.app" 175 190 \
            --hide-extension "FileOpener.app" \
            --app-drop-link 425 185 \
            "$DMG_NAME" \
            "dmg_staging/"

      - name: 删除旧的 Latest Release / Delete existing release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || echo "Release not found, skipping..."

      - name: 发布新的 Latest Release / Create new Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Release
          target_commitish: ${{ github.sha }}
          body: "通过 GitHub Actions 自动构建的最新版本 (Latest Release built automatically).\n\n包含最新 commit: ${{ github.sha }}"
          files: FileOpener.dmg
          draft: false
          prerelease: false
