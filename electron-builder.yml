appId: com.kentxxq.file-opener
productName: FileOpener
directories:
  output: dist
  buildResources: build
mac:
  target: dmg
  category: public.app-category.utilities
  icon: null
  extendInfo:
    CFBundleDevelopmentRegion: en
    CFBundleAllowMixedLocalizations: true
extraResources:
  - from: resources/file-assoc-helper
    to: file-assoc-helper
extraFiles:
  - from: build/zh-Hans.lproj
    to: zh-Hans.lproj
  - from: build/en.lproj
    to: en.lproj
files:
  - filter:
      - out/**/*
